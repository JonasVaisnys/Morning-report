name: Brevo patikra

# Tik būsenos patikra (nieko nesiunčia): šiandienos kampanijų būsena ir statistika. Rezultatas – data/patikra/ šioje šakoje.

on:
  push:
    branches: [brevo-patikra]

permissions:
  contents: write

jobs:
  busena:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Kampanijų būsena
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          mkdir -p data/patikra
          python - <<'PY' > data/patikra/busena-2026-11-23.json
          import json, sys
          from datetime import datetime
          sys.path.insert(0, "scripts")
          import brevo
          out = {"laikas": datetime.now(brevo.LT).isoformat(timespec="seconds"), "kampanijos": []}
          for cid in (9, 10, 11):
              st, c = brevo.call("GET", f"/emailCampaigns/{cid}", params={"statistics": "globalStats"})
              g = ((c.get("statistics") or {}).get("globalStats") or {}) if st == 200 else {}
              out["kampanijos"].append({"id": cid, "http": st, "pavadinimas": c.get("name"), "būsena": c.get("status"), "išsiųsta": c.get("sentDate"),
                                        "sąrašai": (c.get("recipients") or {}).get("lists"), "statistika": {k: g.get(k) for k in ("sent", "delivered", "hardBounces", "softBounces", "uniqueViews")}})
          print(json.dumps(out, ensure_ascii=False, indent=1))
          PY
          cat data/patikra/busena-2026-11-23.json
      - name: Išsaugoti rezultatą
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin brevo-patikra || true
          git add data/patikra
          git commit -m "Brevo: kampanijų būsena 2026-11-23" || true
          git push origin HEAD:brevo-patikra || true
