name: Brevo patikra

# Tikrina Brevo siuntimo kelią šioje šakoje. Rezultatas – data/patikra/ šioje šakoje.
# Planavimo patikra: sukuria suplanuotą bandomąją kampaniją (tik sąrašui #2), perskaito jos būseną ir ją ištrina.
# Laiškų nesiunčia, pagrindinės šakos nekeičia.

on:
  push:
    branches: [brevo-patikra]

permissions:
  contents: write

jobs:
  patikra:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sąrašai pagal dienas
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          mkdir -p data/patikra
          python - <<'PY' > data/patikra/brevo-sarasai.json
          import json, sys
          sys.path.insert(0, "scripts")
          import brevo
          NAMES = ["MR pirmadienis","MR antradienis","MR trečiadienis","MR ketvirtadienis","MR penktadienis","MR šeštadienis","MR sekmadienis","MR savaitės apžvalga"]
          st, b = brevo.call("GET", "/contacts/lists", params={"limit": 50})
          have = {l["name"]: l["id"] for l in b.get("lists", [])}
          out = {"sąrašai": {}, "klaidos": []}
          for n in NAMES:
              if n not in have:
                  st, r = brevo.call("POST", "/contacts/lists", json={"name": n, "folderId": 1})
                  if st in (200, 201): have[n] = r.get("id")
                  else: out["klaidos"].append({n: [st, r]})
          st, c = brevo.call("GET", "/contacts/lists/3/contacts", params={"limit": 500})
          emails = [x["email"] for x in c.get("contacts", [])] if st == 200 else []
          out["gavėjų_sąraše_3"] = len(emails)
          for n in NAMES:
              lid = have.get(n)
              if not lid: continue
              st, r = brevo.call("POST", f"/contacts/lists/{lid}/contacts/add", json={"emails": emails}) if emails else (0, {})
              ok = len((r.get("contacts") or {}).get("success", [])) if isinstance(r, dict) else 0
              out["sąrašai"][n] = {"id": lid, "pridėta_http": st, "pridėta": ok}
          print(json.dumps(out, ensure_ascii=False, indent=1))
          PY
      - name: Įrašyti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/patikra
          git commit -m "Brevo planavimo patikra" || exit 0
          git push
