name: Brevo patikra

# Tikrina Brevo siuntimo kelią šioje šakoje. Rezultatas – data/patikra/ šioje šakoje.
# Planavimo patikra: sukuria suplanuotą bandomąją kampaniją (tik sąrašui #2), perskaito jos būseną ir ją ištrina.
# Laiškų nesiunčia, pagrindinės šakos nekeičia.

on:
  push:
    branches: [brevo-patikra]

permissions:
  contents: write

jobs:
  patikra:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bandomosios kampanijos atšaukimas
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          mkdir -p data/patikra
          python - <<'PY' > data/patikra/brevo-kampanijos.json
          import json, sys
          sys.path.insert(0, "scripts")
          import brevo
          out = {"prieš": [], "veiksmai": [], "po": []}
          def sąrašas():
              st, b = brevo.call("GET", "/emailCampaigns", params={"limit": 50, "sort": "desc"})
              return [{"id": c.get("id"), "name": c.get("name"), "status": c.get("status"), "scheduledAt": c.get("scheduledAt"), "sentDate": c.get("sentDate"), "sąrašai": (c.get("recipients") or {}).get("lists")} for c in b.get("campaigns", [])] if st == 200 else {"http": st, "atsakymas": b}
          out["prieš"] = sąrašas()
          for c in (out["prieš"] if isinstance(out["prieš"], list) else []):
              if str(c["name"]).startswith("Morning Report bandymas") and c["status"] in ("queued", "suspended", "draft"):
                  v = {"id": c["id"], "name": c["name"]}
                  st, b = brevo.call("PUT", f"/emailCampaigns/{c['id']}/status", json={"status": "suspended"})
                  v["sustabdyta"] = {"http": st, "atsakymas": b}
                  st, b = brevo.call("DELETE", f"/emailCampaigns/{c['id']}")
                  v["ištrinta"] = {"http": st, "atsakymas": b}
                  if st not in (200, 204):
                      st2, b2 = brevo.call("PUT", f"/emailCampaigns/{c['id']}/status", json={"status": "draft"})
                      v["į_juodraštį"] = {"http": st2, "atsakymas": b2}
                      st3, b3 = brevo.call("DELETE", f"/emailCampaigns/{c['id']}")
                      v["ištrinta_2"] = {"http": st3, "atsakymas": b3}
                  out["veiksmai"].append(v)
          out["po"] = sąrašas()
          print(json.dumps(out, ensure_ascii=False, indent=1))
          PY
      - name: Įrašyti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/patikra
          git commit -m "Brevo planavimo patikra" || exit 0
          git push
