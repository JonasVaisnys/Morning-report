name: Brevo patikra

# Tikrina Brevo API raktą ir paskyros nustatymus. Rezultatas – data/patikra/brevo.json šioje šakoje.
# Laiškų nesiunčia, pagrindinės šakos nekeičia.

on:
  push:
    branches: [brevo-patikra]

permissions:
  contents: write

jobs:
  patikra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Patikra
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          mkdir -p data/patikra
          python scripts/brevo.py patikra > data/patikra/brevo.json 2> data/patikra/brevo.log || true
          # bandomasis laiškas tik sąrašui #2 (vienas kontaktas – Jonas)
          python scripts/ataskaita.py 2026-11-20 --out /tmp/out 2>> data/patikra/brevo.log
          python scripts/brevo.py kampanija 2026-11-20 --sarasas 2 --bandymas --public /tmp/out > data/patikra/brevo-kampanija.json 2>> data/patikra/brevo.log || true
          curl -s https://api.ipify.org > data/patikra/github-ip.txt || true
      - name: Įrašyti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/patikra
          git commit -m "Brevo patikra" || exit 0
          git push
