name: Morning report

# Kas rytą surenka duomenis ir pagamina Morning Report failus aplanke public/
# svetainei ir laiškui (žr. scripts/ataskaita.py).
# Pagrindinį paleidimą 05:30 Vilniaus laiku daro Power Automate (workflow_dispatch); laišką siunčia Brevo (paskutinis žingsnis),
# tvarkaraštis – tik atsarginis: jis nieko nedaro, jei šios dienos ataskaita jau paruošta.

on:
  schedule:
    # 02:17 UTC = 04:17 Vilniaus laiku žiemą, 05:17 vasarą (GitHub tvarkaraštį dažnai vėlina)
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data (YYYY-MM-DD), tuščia = šiandien"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: morning-report
  cancel-in-progress: false

jobs:
  energijos-brifingas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # naujausia šakos versija, ne paleidimo metu buvusi: jei paleidimas laukė eilėje,
      # jis mato ankstesnio paleidimo rezultatą ir išsaugodamas nesusiduria su juo
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Ataskaitos data
        run: |
          D="${{ github.event.inputs.date }}"
          [ -n "$D" ] || D=$(TZ=Europe/Vilnius date +%F)
          echo "DATE=$D" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat public/data.txt 2>/dev/null)" = "$D" ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "Šios dienos ($D) ataskaita jau paruošta – atsarginis paleidimas praleidžiamas."
          fi
          echo "Ataskaitos data: $D"

      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Priklausomybės
        if: env.SKIP != 'true'
        run: pip install -r requirements.txt

      - name: Elektros kainos
        if: env.SKIP != 'true'
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          python "scripts/kainų brifingas.py" "$DATE" --json > data/energijos-brifingas.json 2> data/json-debug.log || true
          echo "--- kainų brifingas ---"; tail -n 25 data/json-debug.log

      - name: Kainos veiksnių duomenys
        if: env.SKIP != 'true'
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          timeout 600 python "scripts/istorijos papildymas.py" "$DATE" 2> data/istorijos-papildymas.log || true
          echo "--- istorijos papildymas ---"; tail -n 40 data/istorijos-papildymas.log

      - name: Rinkos situacija ir kainos veiksniai
        if: env.SKIP != 'true'
        run: |
          if ! python "scripts/rinkos situacija.py" "$DATE" --json > data/elektros-rinka.json 2> data/elektros-rinka-debug.log; then
            echo "{}" > data/elektros-rinka.json
          fi
          [ -s data/elektros-rinka.json ] || echo "{}" > data/elektros-rinka.json
          echo "--- rinkos situacija ---"; tail -n 20 data/elektros-rinka-debug.log; head -c 600 data/elektros-rinka.json; echo

      - name: Naujienos
        if: env.SKIP != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          timeout 300 python "scripts/naujienų brifingas.py" "$DATE" > /dev/null 2> data/naujienų-debug.log || true
          echo "--- naujienos ---"; tail -n 30 data/naujienų-debug.log

      - name: Teisės aktai
        if: env.SKIP != 'true'
        run: |
          # data.gov.lt užkarda GitHub serverių neprileidžia, todėl aktus ~04:40 surenka
          # suplanuota užduotis per Jono Chrome į data/šaltiniai/tar.json; API – tik atsarginis
          python "scripts/teisės aktai.py" --json --data "$DATE" --is-failo data/šaltiniai/tar.json > data/teisės-aktai.json 2> data/teisės-aktai-debug.log || true
          python "scripts/teisės aktai.py" --data "$DATE" --is-failo data/šaltiniai/tar.json > data/teisės-aktai.txt 2>> data/teisės-aktai-debug.log || true
          echo "--- teisės aktai ---"; tail -n 10 data/teisės-aktai-debug.log

      - name: Pasaulio rinkos
        if: env.SKIP != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
        run: |
          # laiko riba, kad lėtas šaltinis nevėlintų viso ryto ataskaitos
          timeout 480 python "scripts/pasaulio rinkos.py" "$DATE" > /dev/null 2> data/pasaulio-rinkos-debug.log || true
          [ -f data/pasaulio-rinkos.md ] || echo "Pasaulio rinkų skyriaus sugeneruoti nepavyko." > data/pasaulio-rinkos.md
          [ -f data/pasaulio-rinkos.json ] || echo '{"klaida": "nesugeneruota"}' > data/pasaulio-rinkos.json
          echo "--- pasaulio rinkos ---"; tail -n 20 data/pasaulio-rinkos-debug.log

      - name: Ataskaita svetainei ir laiškui
        if: env.SKIP != 'true'
        run: |
          python scripts/ataskaita.py "$DATE"
          echo "--- public/ ---"; ls -la public public/archyvas; cat public/tema.txt; cat public/data.txt; echo

      - name: Išsaugoti rezultatą
        if: env.SKIP != 'true'
        run: |
          git config user.name "Morning Report Bot"
          git config user.email "bot@enerconsult.lt"
          git add data public
          if git diff --cached --quiet; then echo "Pakeitimų nėra."; exit 0; fi
          git commit -q -m "Morning report $DATE"
          for i in 1 2 3; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Nepavyko įkelti rezultato." >&2
          exit 1

      # Laiškas prenumeratoriams per Brevo (tos savaitės dienos sąrašas): suplanuojamas 7:00 Vilniaus laiku,
      # jei jau vėliau – išsiunčiamas iš karto. Tos pačios dienos kampanija antrą kartą nekuriama.
      # Tik šiandienos ataskaitai (rankiniai paleidimai praeities datoms laiško nesiunčia).
      - name: Laiškas per Brevo
        if: env.SKIP != 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ "$DATE" != "$(TZ=Europe/Vilnius date +%F)" ]; then echo "Ne šiandienos data – laiškas nesiunčiamas."; exit 0; fi
          # prenumeratoriai patys pasirenka dienas: Brevo sąrašai #4 (pirmadienis) … #10 (sekmadienis)
          LIST=$(( $(TZ=Europe/Vilnius date +%u) + 3 ))
          python scripts/brevo.py kampanija "$DATE" --sarasas "$LIST"
