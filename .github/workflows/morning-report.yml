name: Morning report

on:
  schedule:
    # 03:00 UTC = 06:00 EEST (vasarą)
    # Žiemą pakeisti į "0 4 * * *" → 06:00 EET
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data (YYYY-MM-DD), tuščia = šiandien"
        required: false
        type: string

permissions:
  contents: write

jobs:
  energijos-brifingas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Priklausomybės
        run: pip install -r requirements.txt

      - name: Energijos brifingas
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then
            python "scripts/kainų brifingas.py" --json > data/energijos-brifingas.json 2> data/json-debug.log
          else
            python "scripts/kainų brifingas.py" "$DATE_ARG" --json > data/energijos-brifingas.json 2> data/json-debug.log
          fi
          echo "--- JSON debug log ---"
          cat data/json-debug.log

      - name: Tekstinis brifingas + debug
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then
            python "scripts/kainų brifingas.py" 2> data/debug.log
          else
            python "scripts/kainų brifingas.py" "$DATE_ARG" 2> data/debug.log
          fi
          echo "--- Debug log ---"
          cat data/debug.log

      - name: Naujienų brifingas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python "scripts/naujienų brifingas.py" 2> data/naujienų-debug.log || true
          echo "--- Naujienų debug ---"
          cat data/naujienų-debug.log

      - name: Išsaugoti rezultatą
        run: |
          git config user.name "Morning Report Bot"
          git config user.email "bot@enerconsult.lt"
          git add data/energijos-brifingas.json data/debug.log data/json-debug.log \
                  data/naujienų-brifingas.md data/naujienų-debug.log
          git diff --cached --quiet || git commit -m "Morning report $(date +%Y-%m-%d)"
          git push
