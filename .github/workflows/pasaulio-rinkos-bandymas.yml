name: Pasaulio rinkų bandymas

# Laikinas bandomasis workflow – veikia tik šakoje „pasaulio-rinkos".
# Rezultatus įrašo į bandymas/ ir įkelia atgal į tą pačią šaką.
on:
  push:
    branches: [pasaulio-rinkos]

permissions:
  contents: write

jobs:
  bandymas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Priklausomybės
        run: pip install -r requirements.txt

      - name: AGSI struktūros patikra
        run: |
          mkdir -p bandymas
          for q in "type=eu" "country=LV" "type=eu&date=2025-10-09"; do
            echo "### $q"
            curl -s -m 20 "https://agsi.gie.eu/api?$q" | head -c 1200
            echo
          done > bandymas/agsi.txt 2>&1 || true

      - name: Pasaulio rinkų brifingas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
        run: |
          python "scripts/pasaulio rinkos.py" > /dev/null 2> bandymas/pasaulio-rinkos-debug.log || true
          cp data/pasaulio-rinkos.json data/pasaulio-rinkos.md bandymas/ || true

      - name: Kryžminė patikra
        run: |
          pip install xlrd
          python bandymas/patikra.py > bandymas/patikra.txt 2>&1 || true

      - name: Išsaugoti rezultatą šakoje
        run: |
          git config user.name "Morning Report Bot"
          git config user.email "bot@enerconsult.lt"
          git add bandymas/
          git diff --cached --quiet || git commit -m "Bandymo rezultatai $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
