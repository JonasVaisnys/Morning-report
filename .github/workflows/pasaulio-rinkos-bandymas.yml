name: Pasaulio rinkų bandymas

# Laikinas bandomasis workflow – veikia tik šakoje „pasaulio-rinkos".
on:
  push:
    branches: [pasaulio-rinkos]

jobs:
  bandymas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Priklausomybės
        run: pip install requests openpyxl anthropic

      - name: Šaltinių patikra
        run: python "scripts/šaltinių patikra.py"
