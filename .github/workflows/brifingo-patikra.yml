name: Kainų brifingo patikra

# Paleidžia tik kainų brifingą pasirinktoms datoms ir rezultatą įrašo į data/patikra/
# toje pačioje šakoje. Pagrindinės šakos ir rytinės ataskaitos neliečia,
# Claude API nenaudoja.

on:
  push:
    branches: [kainos-veiksniai]
    paths:
      - "scripts/kainų brifingas.py"
      - ".github/workflows/brifingo-patikra.yml"

permissions:
  contents: write

jobs:
  patikra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Priklausomybės
        run: pip install "requests>=2.31"

      - name: Brifingas pasirinktoms datoms
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          mkdir -p data/patikra
          for D in 2026-10-09 2026-11-11; do
            python "scripts/kainų brifingas.py" "$D" --json > "data/patikra/brifingas-$D.json" 2> "data/patikra/brifingas-$D.log" || true
            # žurnale negali likti saugos rakto
            sed -i -E 's/securityToken=[^& )]+/securityToken=***/g' "data/patikra/brifingas-$D.log"
          done

      - name: A75 atsakymo struktūra (diagnostika)
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          python - <<'PY' > data/patikra/a75-struktura.txt 2>&1 || true
          import os, requests, xml.etree.ElementTree as ET
          for ps, pe in (("202610082200", "202610092200"), ("202611102300", "202611112300")):
              try:
                  r = requests.get("https://web-api.tp.entsoe.eu/api", params={"documentType": "A75", "processType": "A16",
                      "in_Domain": "10YLT-1001A0008Q", "periodStart": ps, "periodEnd": pe, "securityToken": os.environ["ENTSOE_TOKEN"]}, timeout=120)
              except Exception as exc:
                  print("===", ps, pe, "klaida:", type(exc).__name__); continue
              print("===", ps, pe, "HTTP", r.status_code, len(r.text), "simb.")
              root = ET.fromstring(r.text); ns = {"n": root.tag[1:root.tag.index("}")]}
              for ts in root.findall("n:TimeSeries", ns):
                  psr = ts.find("n:MktPSRType/n:psrType", ns).text
                  kind = "vart" if ts.find("n:outBiddingZone_Domain.mRID", ns) is not None else "gam"
                  curve = ts.find("n:curveType", ns).text
                  for per in ts.findall("n:Period", ns):
                      st = per.find("n:timeInterval/n:start", ns).text; en = per.find("n:timeInterval/n:end", ns).text
                      res = per.find("n:resolution", ns).text
                      pts = [(int(p.find("n:position", ns).text), float(p.find("n:quantity", ns).text)) for p in per.findall("n:Point", ns)]
                      pos = [a for a, _ in pts]
                      print(f"{psr} {kind} {curve} {st}..{en} {res} taškų {len(pts)} poz. {pos[0]}..{pos[-1]} pirmi {pts[:3]} nuliai {sum(1 for _, v in pts if v == 0)}")
          PY
          # žurnale negali likti saugos rakto (pvz. tinklo klaidos pranešime)
          sed -i -E 's/securityToken=[^& )\x27"]+/securityToken=***/g' data/patikra/a75-struktura.txt

      - name: Išsaugoti
        run: |
          git config user.name "Morning Report Bot"
          git config user.email "bot@enerconsult.lt"
          git add data/patikra
          git diff --cached --quiet || git commit -m "Kainų brifingo patikros rezultatai"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
